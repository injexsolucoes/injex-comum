[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injex-comum"
version = "1.2.0"
description = "Peças comuns aos sistemas da Injex Soluções: ícones, páginas legais, textos, construtor de blocos e erros com a origem. Sem dados de clientes."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["injex_comum"]

[tool.setuptools.package-data]
injex_comum = ["estatico/*"]
